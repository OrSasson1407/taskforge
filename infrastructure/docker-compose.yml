version: '3.8'
services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes # AOF persistence enabled[cite: 2]
    ports:
      - '6367:6379'

  orchestrator:
    build:
      context: ../
      dockerfile: packages/orchestrator/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6367
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8067
    ports:
      - '8067:8080'
    depends_on:
      - redis
      - firestore-emulator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ../
      dockerfile: packages/worker/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6367
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8067
    depends_on:
      - orchestrator

  firestore-emulator:
    image: google/cloud-sdk:alpine
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8080
    ports:
      - '8080:8080'

  dashboard:
    build:
      context: ../
      dockerfile: packages/dashboard/Dockerfile
    ports:
      - '3001:3000'

