services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '6367:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  firestore-emulator:
    build:
      context: ./firestore-emulator
    ports:
      - '8085:8080'
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  orchestrator:
    build:
      context: ../
      dockerfile: packages/orchestrator/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - JWT_SECRET=${JWT_SECRET:-dev_secret_replace_in_prod}
      - WORKER_AUTH_TOKEN=${WORKER_AUTH_TOKEN:-dev_worker_token}
    ports:
      - '8067:8080'
    depends_on:
      redis:
        condition: service_healthy
      firestore-emulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ../
      dockerfile: packages/worker/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - WORKER_AUTH_TOKEN=${WORKER_AUTH_TOKEN:-dev_worker_token}
    depends_on:
      orchestrator:
        condition: service_healthy

  dashboard:
    build:
      context: ../
      dockerfile: packages/dashboard/Dockerfile
    ports:
      - '3001:3000'